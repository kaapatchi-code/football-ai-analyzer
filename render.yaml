services:
  - type: web
    name: football-ai-analyzer-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /api/status
    envVars:
      - key: API_FOOTBALL_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"
